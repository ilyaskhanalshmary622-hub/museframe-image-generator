<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseFrame</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="access-gate" class="access-gate">
    <div class="gate-card">
      <span class="mark">MF</span>
      <p class="eyebrow">PRIVATE STUDIO</p>
      <h1>MuseFrame</h1>
      <p>输入访问密码后进入生图工作台。</p>
      <div class="gate-form">
        <input id="access-password" type="password" placeholder="输入访问密码">
        <button id="unlock-site" type="button">进入</button>
      </div>
      <small id="gate-message"></small>
    </div>
  </section>

  <main id="app-shell" class="shell locked">
    <header class="topbar">
      <div class="brand">
        <span class="mark">MF</span>
        <div>
          <strong>MuseFrame</strong>
          <small>Product Image Studio</small>
        </div>
      </div>
      <div class="keybar">
        <input id="api-key" type="password" placeholder="输入 Grsai API Key">
        <button id="save-key" type="button">设置 API Key</button>
        <button id="check-balance" class="soft" type="button">检测 Key</button>
      </div>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">PRODUCT IMAGE STUDIO</p>
        <h1>MuseFrame</h1>
        <p>输入提示词生成商品图；上传参考图后可做图生图。适合产品主图、场景图、广告素材、包装视觉和商单提案。</p>
      </div>
      <aside class="balance-card">
        <span>连接状态</span>
        <strong id="balance-value">未设置 Key</strong>
        <p id="balance-detail">API Key 只保存在当前浏览器本地，也可以配置在服务端环境变量。</p>
      </aside>
    </section>

    <section class="workspace">
      <section class="result-panel">
        <div class="panel-head">
          <div>
            <b>生成结果</b>
            <span id="mode-label">文生图模式</span>
          </div>
          <button id="download-image" class="soft" type="button" disabled>下载图片</button>
        </div>
        <div class="stage" id="image-stage">
          <div class="empty">
            <strong>等待生成</strong>
            <span>输入提示词，或拖入参考图后生成。</span>
          </div>
        </div>
        <p id="message">准备就绪。</p>
      </section>

      <section class="control-panel">
        <label class="drop-zone" id="drop-zone" for="reference-file">
          <input id="reference-file" type="file" accept="image/*" multiple>
          <div id="upload-placeholder">
            <i>+</i>
            <b>点击上传 / 拖入参考图</b>
            <span>可放产品图、Logo、材质图、场景参考图，最多 8 张。</span>
          </div>
          <div class="reference-list" id="reference-list"></div>
        </label>

        <div class="settings-grid">
          <label class="field">
            <span>模型</span>
            <select id="model">
              <option value="gpt-image-2.5" selected>gpt-image-2.5</option>
              <option value="gpt-image-2">gpt-image-2</option>
              <option value="gpt-image-2-vip">gpt-image-2-vip</option>
              <option value="gpt-image-2.5-flare">gpt-image-2.5-flare</option>
              <option value="gpt-image-2.5-sunburst">gpt-image-2.5-sunburst</option>
            </select>
          </label>

          <label class="field">
            <span>比例</span>
            <select id="aspect-ratio">
              <option value="1024x1024" selected>1:1 方图</option>
              <option value="1280x720">16:9 横版</option>
              <option value="720x1280">9:16 竖版</option>
              <option value="1152x864">4:3 横版</option>
              <option value="864x1152">3:4 竖版</option>
              <option value="1536x1024">3:2 横版</option>
              <option value="1024x1536">2:3 竖版</option>
              <option value="1120x896">5:4 横版</option>
              <option value="896x1120">4:5 竖版</option>
              <option value="1920x832">21:9 超宽</option>
              <option value="832x1920">9:21 长竖</option>
            </select>
          </label>

          <label class="field">
            <span>张数</span>
            <select id="image-count">
              <option value="1" selected>1 张</option>
              <option value="2">2 张</option>
              <option value="3">3 张</option>
              <option value="4">4 张</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>提示词</span>
          <textarea id="prompt" placeholder="例如：生成一张高级真实的真空压缩收纳袋商品图，暖米白背景，鼠尾草绿文字，产品正面朝前，质感清晰，1:1 电商主图风格。"></textarea>
        </label>

        <div class="actions">
          <button id="clear" class="soft" type="button">清空</button>
          <button id="generate" type="button">生成图片</button>
        </div>
      </section>
    </section>

    <section class="history">
      <div class="panel-head">
        <div>
          <b>提示词记录</b>
          <span>自动保存最近 12 条，方便复用和整理。</span>
        </div>
        <button id="clear-history" class="soft" type="button">清空历史</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
