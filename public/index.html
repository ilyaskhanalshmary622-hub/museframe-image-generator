<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseFrame</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="gate" id="gate">
    <div class="gate-card">
      <p>MUSEFRAME ACCESS</p>
      <h1>MuseFrame</h1>
      <span>输入访问密码后进入生图工作台。API Key 只保存在服务器环境变量里。</span>
      <input id="access-password" type="password" placeholder="访问密码">
      <button id="unlock" type="button">进入</button>
      <small id="gate-message"></small>
    </div>
  </section>

  <main class="app locked" id="app">
    <header class="hero">
      <div>
        <p class="eyebrow">AI IMAGE GENERATOR</p>
        <h1>MuseFrame</h1>
        <p>一句提示词生成商品图。上传参考图后自动切换为图生图，适合产品主图、场景图、广告素材和视觉方案草图。</p>
      </div>
      <aside>
        <span>生成能量</span>
        <strong id="energy-value">86%</strong>
        <div class="energy"><i id="energy-fill"></i></div>
      </aside>
    </header>

    <section class="workspace">
      <div class="panel composer">
        <label class="drop-zone" id="drop-zone" for="reference-file">
          <input id="reference-file" type="file" accept="image/*" multiple>
          <div id="upload-placeholder">
            <b>拖入参考图</b>
            <span>可上传多张图片：产品、Logo、场景、材质参考都可以。</span>
          </div>
          <div class="reference-list" id="reference-list"></div>
        </label>

        <label>
          <span>提示词</span>
          <textarea id="prompt" placeholder="例如：生成一张高级真实的真空压缩收纳袋商品图，暖米白背景，鼠尾草绿文字，产品正面朝前，质感清晰，1:1，电商主图风格。"></textarea>
        </label>

        <div class="grid">
          <label>
            <span>比例</span>
            <select id="ratio">
              <option value="1:1">1:1</option>
              <option value="3:4">3:4</option>
              <option value="4:5">4:5</option>
              <option value="9:16">9:16</option>
              <option value="16:9">16:9</option>
            </select>
          </label>
          <label>
            <span>清晰度</span>
            <select id="quality">
              <option value="1k" selected>1K</option>
              <option value="2k">2K</option>
              <option value="4k">4K</option>
              <option value="8k">8K</option>
            </select>
          </label>
          <label>
            <span>模式</span>
            <select id="edit-mode">
              <option value="generate">直接生成</option>
              <option value="replace-product">替换产品</option>
              <option value="replace-element">替换元素</option>
              <option value="replace-background">替换背景</option>
              <option value="keep-product">保留产品重做场景</option>
            </select>
          </label>
        </div>

        <label>
          <span>替换/补充要求</span>
          <textarea id="edit-brief" class="small" placeholder="例如：保留场景光影，只替换产品；Logo 对准正前方，材质真实。"></textarea>
        </label>

        <div class="actions">
          <button id="clear" class="ghost" type="button">清空</button>
          <button id="generate" type="button">生成图片</button>
        </div>
      </div>

      <div class="panel result">
        <div class="result-head">
          <span>生成结果</span>
          <b id="mode-label">文生图模式</b>
        </div>
        <div class="stage" id="image-stage">
          <div class="empty">
            <strong>还没有生成图片</strong>
            <span>输入提示词后点击生成。上传参考图会自动进入图生图。</span>
          </div>
        </div>
        <p id="message">准备就绪。</p>
      </div>
    </section>

    <section class="panel history">
      <div class="history-title">
        <div>
          <p class="eyebrow">PROMPT LIBRARY</p>
          <h2>提示词记录</h2>
        </div>
        <button id="clear-history" class="ghost" type="button">清空记录</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
